syntax = "proto3";

package interview;

service InterviewAIService {
  rpc AnalyzeFrame (FeatureRequest) returns (AnalysisResponse);
  rpc AnalyzeFrameStream (stream FeatureRequest) returns (stream AnalysisResponse);

  rpc HealthCheck (HealthRequest) returns (HealthResponse);

  rpc GenerateInitialQuestions (InitialQuestionGenerateRequest) returns (InitialQuestionGenerateResponse);
  rpc GenerateFollowUpQuestion (FollowUpQuestionGenerateRequest) returns (FollowUpQuestionGenerateResponse);

  rpc GenerateSubtitles (SubtitleRequest) returns (SubtitleResponse);
  rpc AnalyzeVoiceTone (VoiceToneAnalysisRequest) returns (VoiceToneAnalysisResponse);
}

message FeatureRequest {
  string session_id = 1;
  string user_id = 2;
  repeated int32 tensor_shape = 3;
  repeated float features = 4;
  int64 timestamp = 5;
  bool face_detected = 6;
  BoundingBox bbox = 7;
}

message BoundingBox {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
}

message AnalysisResponse {
  string session_id = 1;
  string user_id = 2;
  string label = 3;
  float confidence = 4;
  string feedback = 5;
  int64 timestamp = 6;
  bool face_detected = 7;
  BoundingBox bbox = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model_path = 2;
  string question_client_status = 3;
  string subtitle_client_status = 4;
  string voice_tone_analyzer_status = 5;
}

message InitialQuestionGenerateRequest {
  string session_id = 1;
  string user_id = 2;
  string category = 3;
  string interview_type = 4;
  string difficulty = 5;
  int32 question_count = 6;
  int32 time_per_question = 7;
  string resume_text = 8;
  string language = 9;
}

message InitialQuestionGenerateResponse {
  string session_id = 1;
  string user_id = 2;
  repeated QuestionItem questions = 3;
}

message FollowUpQuestionGenerateRequest {
  string session_id = 1;
  string user_id = 2;
  string previous_question = 3;
  string answer = 4;
  string category = 5;
  string interview_type = 6;
  string difficulty = 7;
  string resume_text = 8;
  repeated InterviewTurn history = 9;
  string language = 10;
}

message FollowUpQuestionGenerateResponse {
  string session_id = 1;
  string user_id = 2;
  QuestionItem question = 3;
}

message QuestionItem {
  int32 index = 1;
  string question = 2;
  string tooltip = 3;
  string category = 4;
  string intent = 5;
  repeated string answer_keywords = 6;
}

message InterviewTurn {
  int32 index = 1;
  string question = 2;
  string answer = 3;
}

message SubtitleRequest {
  string session_id = 1;
  string user_id = 2;
  bytes audio = 3;
  string audio_mime_type = 4;
  string language_hint = 5;
}

message SubtitleSegmentMessage {
  int32 index = 1;
  int64 start_ms = 2;
  int64 end_ms = 3;
  string text = 4;
}

message SubtitleResponse {
  string session_id = 1;
  string user_id = 2;
  string language = 3;
  string summary = 4;
  repeated SubtitleSegmentMessage segments = 5;
  string srt = 6;
}

message VoiceToneAnalysisRequest {
  string session_id = 1;
  string user_id = 2;
  bytes audio = 3;
  string audio_mime_type = 4;
  string language_hint = 5;
}

message VoiceToneAnalysisResponse {
  string session_id = 1;
  string user_id = 2;

  double pitch_mean = 3;
  double pitch_std = 4;
  double pitch_stability = 5;

  double energy_mean = 6;
  double energy_std = 7;
  double energy_stability = 8;

  double pause_ratio = 9;
  double speech_duration_sec = 10;
  double total_duration_sec = 11;

  double overall_stability_score = 12;
  string feedback = 13;
}
