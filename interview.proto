cat > interview.proto <<'EOF'
syntax = "proto3";

package interview;

service InterviewAIService {
  rpc AnalyzeFrame (FeatureRequest) returns (AnalysisResponse);
  rpc AnalyzeFrameStream (stream FeatureRequest) returns (stream AnalysisResponse);
  rpc HealthCheck (HealthRequest) returns (HealthResponse);

  rpc GenerateQuestions (QuestionGenerateRequest) returns (QuestionGenerateResponse);
}

message FeatureRequest {
  string session_id = 1;
  string user_id = 2;

  repeated int32 tensor_shape = 3;
  repeated float features = 4;

  int64 timestamp = 5;
  bool face_detected = 6;
  BoundingBox bbox = 7;
}

message BoundingBox {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
}

message AnalysisResponse {
  string session_id = 1;
  string user_id = 2;
  string label = 3;
  float confidence = 4;
  string feedback = 5;
  int64 timestamp = 6;
  bool face_detected = 7;
  BoundingBox bbox = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model_path = 2;
  string question_client_status = 3;
}

message QuestionGenerateRequest {
  string session_id = 1;
  string user_id = 2;

  string job_role = 3;
  string company_name = 4;
  string resume_text = 5;
  string interview_type = 6;
  int32 question_count = 7;
  string difficulty = 8;
  string language = 9;
}

message QuestionItem {
  int32 index = 1;
  string question = 2;
  string tooltip = 3;
  string category = 4;
  string intent = 5;
  repeated string answer_keywords = 6;
}

message QuestionGenerateResponse {
  string session_id = 1;
  string user_id = 2;
  repeated QuestionItem questions = 3;
}
EOF