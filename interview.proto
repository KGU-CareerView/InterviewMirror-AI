syntax = "proto3";

package interview;

service InterviewAIService {
  rpc AnalyzeFrame (FeatureRequest) returns (AnalysisResponse);
  rpc AnalyzeFrameStream (stream FeatureRequest) returns (stream AnalysisResponse);

  rpc HealthCheck (HealthRequest) returns (HealthResponse);

  rpc GenerateInitialQuestions (InitialQuestionGenerateRequest)
      returns (InitialQuestionGenerateResponse);

  rpc GenerateFollowUpQuestion (FollowUpQuestionGenerateRequest)
      returns (FollowUpQuestionGenerateResponse);
}

message FeatureRequest {
  string session_id = 1;
  string user_id = 2;
  repeated int32 tensor_shape = 3;
  repeated float features = 4;
  int64 timestamp = 5;
  bool face_detected = 6;
  BoundingBox bbox = 7;
}

message BoundingBox {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
}

message AnalysisResponse {
  string session_id = 1;
  string user_id = 2;
  string label = 3;
  float confidence = 4;
  string feedback = 5;
  int64 timestamp = 6;
  bool face_detected = 7;
  BoundingBox bbox = 8;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model_path = 2;
  string question_client_status = 3;
}

message InitialQuestionGenerateRequest {
  string session_id = 1;
  string user_id = 2;

  string category = 3;
  string interview_type = 4;
  string difficulty = 5;
  int32 question_count = 6;
  int32 time_per_question = 7;
  string resume_text = 8;
  string language = 9;
}

message InitialQuestionGenerateResponse {
  string session_id = 1;
  string user_id = 2;
  repeated QuestionItem questions = 3;
}

message FollowUpQuestionGenerateRequest {
  string session_id = 1;
  string user_id = 2;

  string previous_question = 3;
  string answer = 4;
  string category = 5;
  string interview_type = 6;
  string difficulty = 7;
  string resume_text = 8;
  repeated InterviewTurn history = 9;
  string language = 10;
}

message FollowUpQuestionGenerateResponse {
  string session_id = 1;
  string user_id = 2;
  QuestionItem question = 3;
}

message QuestionItem {
  int32 index = 1;
  string question = 2;
  string tooltip = 3;
  string category = 4;
  string intent = 5;
  repeated string answer_keywords = 6;
}

message InterviewTurn {
  int32 index = 1;
  string question = 2;
  string answer = 3;
}